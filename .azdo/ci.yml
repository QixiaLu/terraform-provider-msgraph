stages:
  - stage: Build
    jobs:
      - job: build
        timeoutInMinutes: 300
        displayName: "Build: "

        pool:
          type: linux

        variables:
          ob_outputDirectory: $(Build.SourcesDirectory)/out

        steps:
          - checkout: self
            persistCredentials: false

          - bash: mkdir -p "$(ob_outputDirectory)"
            displayName: "Create output directory"

          - template: /.azdo/acctest-steps.yml@self
