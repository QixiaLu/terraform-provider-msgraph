stages:
  - stage: Build
    jobs:
      - job: build
        timeoutInMinutes: 300
        displayName: "Build: "

        pool:
          type: linux

        variables:
          ob_outputDirectory: $(Build.SourcesDirectory)/out

        steps:
          - checkout: self
            persistCredentials: false

          - bash: mkdir -p "$(ob_outputDirectory)"
            displayName: "Create output directory"

          - task: GoTool@0
            displayName: "Install correct version of Go"
            inputs:
              version: '1.24.11'
              GOPATH: "$(Pipeline.Workspace)/gopath"
              GOBIN: "$(GOPATH)/bin"
            env:
              ob_restore_phase: true

          - bash: |
              #!/usr/bin/env bash
              set -euo pipefail
              go version
              go env GOPROXY GOPRIVATE GONOPROXY
              proxy="$(go env GOPROXY)"
              if [[ -z "$proxy" || "$proxy" == *","* || "$proxy" == *"|"* || ! "$proxy" =~ ^https?://[^/]+ ]]; then
                printf 'Expected a single Go proxy endpoint without fallback.\n' >&2
                exit 1
              fi
              # Use a fresh cache so -x shows actual requests to the configured proxy.
              module_cache="$(mktemp -d)"
              trap 'chmod -R u+w "$module_cache"; rm -rf "$module_cache"' EXIT
              export GOMODCACHE="$module_cache"
              go mod download -x all
              go mod verify
            displayName: "Verify Go module proxy and downloads"
            workingDirectory: $(Build.SourcesDirectory)
            env:
              ob_restore_phase: true

          - task: TerraformInstaller@1
            displayName: "Install Terraform"
            inputs:
              terraformVersion: "1.15.1"

          - bash: |
              #!/usr/bin/env bash
              set -euo pipefail
              terraform_path="$(which terraform)"
              echo "Terraform installed at: ${terraform_path}"
              echo "Overriding terraform CLI for acctest to workaround the error: 'cannot run Terraform provider tests: failed to find or install Terraform CLI from [0xc000130100 0xc000154000]: unable to verify checksums signature: openpgp: key expired'"
              echo "##vso[task.setvariable variable=TF_ACC_TERRAFORM_PATH]${terraform_path}"
            displayName: "Configure Terraform CLI for acctest"
            workingDirectory: $(Build.SourcesDirectory)

          - bash: |
              #!/usr/bin/env bash
              make tools
            displayName: "Install Dependencies"
            workingDirectory: $(Build.SourcesDirectory)
            env:
              ob_restore_phase: true

          - bash: |
              #!/usr/bin/env bash
              make depscheck
            displayName: "Verify Vendor Dependencies"
            workingDirectory: $(Build.SourcesDirectory)
            env:
              ob_restore_phase: true

          - bash: |
              #!/usr/bin/env bash
              set -euo pipefail
              if [[ ! -f GNUmakefile ]]; then
                printf 'GNUmakefile is missing from the build container source directory: %s\n' "$PWD" >&2
                printf 'Expected source revision: %s\n' "$EXPECTED_SOURCE_VERSION" >&2
                printf 'Source directory contents:\n' >&2
                ls -la >&2
                printf 'Repository-local directory: %s\n' "$REPOSITORY_LOCAL_PATH" >&2
                if [[ -d "$REPOSITORY_LOCAL_PATH" && "$REPOSITORY_LOCAL_PATH" != "$PWD" ]]; then
                  ls -la "$REPOSITORY_LOCAL_PATH" >&2
                fi
                exit 1
              fi
              make fmtcheck
            displayName: "Run Format Check"
            workingDirectory: $(Build.SourcesDirectory)
            env:
              EXPECTED_SOURCE_VERSION: $(Build.SourceVersion)
              REPOSITORY_LOCAL_PATH: $(Build.Repository.LocalPath)

          - bash: |
              #!/usr/bin/env bash
              make lint
            displayName: "Run Lint Check"
            workingDirectory: $(Build.SourcesDirectory)

          - bash: |
              #!/usr/bin/env bash
              make testacc
            displayName: "Run All Tests"
            workingDirectory: $(Build.SourcesDirectory)
            env:
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              TF_ACC_TERRAFORM_PATH: $(TF_ACC_TERRAFORM_PATH)
              TESTARGS: $(TESTARGS)
